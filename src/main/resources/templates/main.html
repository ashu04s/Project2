<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container-box{

    width:450px;

    background:white;

    padding:40px;

    border-radius:15px;

    box-shadow:0 10px 25px rgba(0,0,0,.2);

    text-align:center;

}

h1{

    margin-bottom:15px;

    color:#333;

}

p{

    color:#666;

    margin-bottom:30px;

}

a{

    display:block;

    text-decoration:none;

    margin:15px 0;

    padding:15px;

    border-radius:8px;

    color:white;

    font-size:20px;

    transition:.3s;

}

.user{

    background:#0d6efd;

}

.user:hover{

    background:#0b5ed7;

}

.admin{

    background:#198754;

}

.admin:hover{

    background:#146c43;

}

</style>

</head>

<body>

<div class="container-box">

    <h1>Welcome</h1>

    <p>Select Your Portal</p>

    <a th:href="@{/home}" class="user">
        👤 User
    </a>

    <a th:href="@{/admin/login}" class="admin">
        👨‍💼 Admin
    </a>

</div>

</body>
</html>
