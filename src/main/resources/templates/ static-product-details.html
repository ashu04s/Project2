<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${name} + ' - Product Details'">
        Product Details
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">


    <style>

        .product-details-section {
            min-height: 80vh;
            padding: 70px 0;
            background: #f8f9fa;
        }


        .product-details-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }


        .product-image-box {
            min-height: 500px;
            padding: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
        }


        .product-image-box img {
            width: 100%;
            max-width: 450px;
            max-height: 450px;

            object-fit: contain;
        }


        .product-info {
            padding: 50px;
        }


        .product-name {
            font-size: 38px;
            font-weight: 700;
            color: #198754;
        }


        .product-price {
            font-size: 32px;
            font-weight: 700;
            margin: 20px 0;
        }


        .product-description {
            color: #666;
            line-height: 1.8;
            font-size: 17px;
        }


        .quantity-box {
            width: 120px;
        }


        @media (max-width: 768px) {

            .product-info {
                padding: 30px;
            }

            .product-name {
                font-size: 30px;
            }

            .product-image-box {
                min-height: 350px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div th:replace="~{fragments/dheader :: header}"></div>



<!-- ================= PRODUCT DETAILS ================= -->

<section class="product-details-section">

    <div class="container">

        <div class="product-details-card">

            <div class="row g-0">


                <!-- ================= IMAGE ================= -->

                <div class="col-lg-6">

                    <div class="product-image-box">

                        <img
                            th:src="${image}"
                            th:alt="${name}">

                    </div>

                </div>



                <!-- ================= PRODUCT INFO ================= -->

                <div class="col-lg-6">

                    <div class="product-info">


                        <!-- Product Name -->

                        <h1
                            class="product-name"
                            th:text="${name}">

                            Product Name

                        </h1>



                        <!-- Rating -->

                        <div class="mb-3">

                            <i class="fa-solid fa-star text-warning"></i>
                            <i class="fa-solid fa-star text-warning"></i>
                            <i class="fa-solid fa-star text-warning"></i>
                            <i class="fa-solid fa-star text-warning"></i>
                            <i class="fa-solid fa-star text-warning"></i>

                            <span class="text-muted ms-2">
                                5.0
                            </span>

                        </div>



                        <!-- Price -->

                        <div class="product-price text-success">

                            ₹<span th:text="${price}">
                                0
                            </span>

                        </div>



                        <!-- Description -->

                        <h5 class="fw-bold mt-4">
                            Description
                        </h5>

                        <p
                            class="product-description"
                            th:text="${description}">

                            Product description

                        </p>



                        <!-- Quantity -->

                        <div class="mt-4">

                            <label
                                for="quantity"
                                class="fw-bold mb-2">

                                Quantity

                            </label>

                            <input
                                type="number"
                                id="quantity"
                                class="form-control quantity-box"
                                value="1"
                                min="1">

                        </div>



                        <!-- ================= BUTTONS ================= -->

                        <div class="mt-4 d-flex gap-3 flex-wrap">


                            <!-- ADD TO CART -->

                            <button
                                type="button"
                                class="btn btn-success btn-lg add-cart"

                                th:data-name="${name}"

                                th:data-price="${price}"

                                th:data-image="${image}">

                                <i class="fa-solid fa-cart-shopping"></i>

                                Add to Cart

                            </button>



                            <!-- BACK TO PRODUCTS -->

                            <a
                                th:href="@{/products}"
                                class="btn btn-outline-success btn-lg">

                                <i class="fa-solid fa-arrow-left"></i>

                                Back to Products

                            </a>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<div th:replace="~{fragments/footer :: footer}"></div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


<!-- CART JS -->

<script th:src="@{/js/cart.js}"></script>


</body>

</html>
