<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Admin CSS -->
    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<!-- Main Content -->
<div class="content">

    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>


    <!-- Heading -->
    <div class="mt-4 mb-4">

        <h3 class="fw-bold">

            <i class="fa-solid fa-gauge-high text-success"></i>

            Dashboard

        </h3>

    </div>


    <!-- ================= CARDS ================= -->

    <div class="row g-4">


        <!-- ================= HOME ================= -->

        <div class="col-lg-3 col-md-6">

            <div class="card shadow border-0 rounded-4 h-100">

                <div class="card-body text-center">

                    <i class="fa-solid fa-house fa-3x text-info mb-3"></i>

                    <h4>Home</h4>

                    <p class="text-muted">
                        Go to Frontend
                    </p>

                    <a th:href="@{/home}"
                       class="btn btn-info text-white">

                        Go Home

                    </a>

                </div>

            </div>

        </div>


        <!-- ================= CATEGORY ================= -->

        <div class="col-lg-3 col-md-6">

            <div class="card shadow border-0 rounded-4 h-100">

                <div class="card-body text-center">

                    <i class="fa-solid fa-list fa-3x text-primary mb-3"></i>

                    <h4>Category</h4>

                    <p class="text-muted">
                        Manage product categories
                    </p>

                    <a th:href="@{/admin/category/show}"
                       class="btn btn-primary">

                        Manage Category

                    </a>

                </div>

            </div>

        </div>


        <!-- ================= BRAND ================= -->

        <div class="col-lg-3 col-md-6">

            <div class="card shadow border-0 rounded-4 h-100">

                <div class="card-body text-center">

                    <i class="fa-solid fa-tags fa-3x text-success mb-3"></i>

                    <h4>Brand</h4>

                    <p class="text-muted">
                        Manage product brands
                    </p>

                    <a th:href="@{/admin/brand/show}"
                       class="btn btn-success">

                        Manage Brand

                    </a>

                </div>

            </div>

        </div>


        <!-- ================= PRODUCT ================= -->

        <div class="col-lg-3 col-md-6">

            <div class="card shadow border-0 rounded-4 h-100">

                <div class="card-body text-center">

                    <i class="fa-solid fa-box-open fa-3x text-warning mb-3"></i>

                    <h4>Product</h4>

                    <p class="text-muted">
                        Manage store products
                    </p>

                    <a th:href="@{/admin/product/list}"
                       class="btn btn-warning">

                        Manage Product

                    </a>

                </div>

            </div>

        </div>


        <!-- ================= ORDERS ================= -->

        <div class="col-lg-3 col-md-6">

            <div class="card shadow border-0 rounded-4 h-100">

                <div class="card-body text-center">

                    <i class="fa-solid fa-cart-shopping fa-3x text-danger mb-3"></i>

                    <h4>Orders</h4>

                    <p class="text-muted">
                        Manage customer orders
                    </p>

                    <a th:href="@{/order/admin/orders}"
                       class="btn btn-danger">

                        Manage Orders

                    </a>

                </div>

            </div>

        </div>


    </div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
