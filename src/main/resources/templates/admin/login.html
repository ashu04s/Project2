<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-4">

            <div class="card shadow p-4">

                <h3 class="text-center mb-4">Admin Login</h3>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control">
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control">
                </div>

                <button class="btn btn-primary w-100" onclick="login()">
                    Login
                </button>

                <p id="msg" class="text-danger mt-3 text-center"></p>

            </div>

        </div>

    </div>

</div>

<script>

function login(){

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    // Fixed Admin Credentials
    let adminEmail = "ashu@gmail.com";
    let adminPassword = "12345";

    if(email === adminEmail && password === adminPassword){

        alert("Login Successful");

        window.location.href="/admin/dashboard";

    }else{

        document.getElementById("msg").innerHTML="Invalid Email or Password";

    }

}

</script>

</body>
</html>
