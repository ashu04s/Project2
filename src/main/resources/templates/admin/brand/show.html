<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brand List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div class="content">

        <!-- Header -->
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mt-4 mb-3">

            <h3 class="fw-bold">
                <i class="fa-solid fa-tags text-success"></i>
                Brand List
            </h3>

            <a th:href="@{/admin/brand/add}"
               class="btn btn-success">
                <i class="fa-solid fa-plus"></i>
                Add Brand
            </a>

        </div>

        <!-- Brand Table -->
        <div class="card shadow border-0 rounded-4">

            <div class="card-header bg-success text-white">
                <h5 class="mb-0">All Brands</h5>
            </div>

            <div class="card-body">

                <!-- Test -->
                <!-- <h5 th:text="${brands}"></h5> -->

                <table class="table table-bordered table-hover text-center align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Brand Name</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:if="${#lists.isEmpty(brands)}">
                        <td colspan="4" class="text-danger fw-bold">
                            No Brand Found
                        </td>
                    </tr>

                    <tr th:each="brand : ${brands}">

                        <td th:text="${brand.brandId}"></td>

                        <td th:text="${brand.brandName}"></td>

                        <td>
                            <span class="badge bg-success"
                                  th:if="${brand.brandStatus=='Active'}"
                                  th:text="${brand.brandStatus}">
                            </span>

                            <span class="badge bg-danger"
                                  th:if="${brand.brandStatus=='Inactive'}"
                                  th:text="${brand.brandStatus}">
                            </span>
                        </td>

                        <td>

                            <a th:href="@{/admin/brand/edit/{id}(id=${brand.brandId})}"
                               class="btn btn-warning btn-sm">
                                <i class="fa-solid fa-pen"></i>
                                Edit
                            </a>

                            <a th:href="@{/admin/brand/delete/{id}(id=${brand.brandId})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this Brand?')">
                                <i class="fa-solid fa-trash"></i>
                                Delete
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
