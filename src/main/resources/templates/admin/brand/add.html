<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div class="content">

        <!-- Header -->
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="fw-bold">
                <i class="fa-solid fa-box-open text-success"></i>
                Add Product
            </h3>

            <a th:href="@{/admin/product/list}"
               class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </a>

        </div>

        <div class="card shadow border-0 rounded-4">

            <div class="card-header bg-success text-white">
                <h5 class="mb-0">
                    Product Information
                </h5>
            </div>

            <div class="card-body">

                <form th:action="@{/admin/product/save}"
                      th:object="${product}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="row">

                        <!-- Product Name -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{product_name}"
                                   placeholder="Enter Product Name">

                        </div>

                        <!-- Category -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select class="form-select"
                                    th:field="*{fk_cat_id}">

                                <option value="">Select Category</option>

                                <option th:each="cat : ${categoryList}"
                                        th:value="${cat.catId}"
                                        th:text="${cat.catName}">
                                </option>

                            </select>

                        </div>

                        <!-- Brand -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Brand
                            </label>

                            <select class="form-select"
                                    th:field="*{fk_brand_id}">

                                <option value="">Select Brand</option>

                                <option th:each="brand : ${brandList}"
                                        th:value="${brand.brandId}"
                                        th:text="${brand.brandName}">
                                </option>

                            </select>

                        </div>

                        <!-- Quantity -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Product Quantity
                            </label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{product_qty}">

                        </div>

                        <!-- Cost Price -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Cost Price
                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{product_cost_price}">

                        </div>

                        <!-- Selling Price -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Selling Price
                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{product_selling_price}">

                        </div>

                        <!-- Rating -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Rating
                            </label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{product_rating}">

                        </div>

                        <!-- Weight -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Product Weight
                            </label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{product_weight}">

                        </div>

                        <!-- Weight Type -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Weight Type
                            </label>

                            <select class="form-select"
                                    th:field="*{product_weight_type}">

                                <option value="g">Gram</option>
                                <option value="kg">Kilogram</option>
                                <option value="l">Litre</option>
                                <option value="ml">Millilitre</option>

                            </select>

                        </div>

                        <!-- Status -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Status
                            </label>

                            <select class="form-select"
                                    th:field="*{product_status}">

                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>

                            </select>

                        </div>

                        <!-- Description -->
                        <div class="col-12 mb-3">

                            <label class="form-label">
                                Product Description
                            </label>

                            <textarea class="form-control"
                                      rows="4"
                                      th:field="*{product_desc}"
                                      placeholder="Enter Product Description">
                            </textarea>

                        </div>

                        <!-- Small Image -->
                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Small Image
                            </label>

                            <input type="file"
                                   class="form-control"
                                   name="file1">

                        </div>

                        <!-- Large Image -->
                        <div class="col-md-6 mb-4">

                            <label class="form-label">
                                Large Image
                            </label>

                            <input type="file"
                                   class="form-control"
                                   name="file2">

                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-success">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Product
                    </button>

                    <a th:href="@{/admin/product/list}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
