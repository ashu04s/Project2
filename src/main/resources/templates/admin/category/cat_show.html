<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div class="content">

        <!-- Header -->
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mt-4 mb-3">

            <h3 class="fw-bold">
                <i class="fa-solid fa-list text-success"></i>
                Category List
            </h3>

            <a th:href="@{/admin/category/add}"
               class="btn btn-success">

                <i class="fa-solid fa-plus"></i>

                Add Category

            </a>

        </div>

        <!-- Category Table -->
        <div class="card shadow border-0 rounded-4">

            <div class="card-header bg-success text-white">

                <h5 class="mb-0">
                    All Categories
                </h5>

            </div>

            <div class="card-body">

                <table class="table table-bordered table-hover text-center align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Category Name</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:if="${#lists.isEmpty(categories)}">

                        <td colspan="4" class="text-danger fw-bold">

                            No Category Found

                        </td>

                    </tr>

                    <tr th:each="category : ${categories}">

                        <td th:text="${category.catId}"></td>

                        <td th:text="${category.catName}"></td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${category.catStatus=='Active'}"
                                  th:text="${category.catStatus}">
                            </span>

                            <span class="badge bg-danger"
                                  th:if="${category.catStatus=='Inactive'}"
                                  th:text="${category.catStatus}">
                            </span>

                        </td>

                        <td>

                            <a th:href="@{/admin/category/edit/{id}(id=${category.catId})}"
                               class="btn btn-warning btn-sm">

                                <i class="fa-solid fa-pen"></i>

                                Edit

                            </a>

                            <a th:href="@{/admin/category/delete/{id}(id=${category.catId})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure?')">

                                <i class="fa-solid fa-trash"></i>

                                Delete

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
