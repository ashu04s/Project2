<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Orders</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- Admin CSS -->

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>


<body>


<!-- ================= SIDEBAR ================= -->

<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<!-- ================= MAIN CONTENT ================= -->

<div class="content">


    <!-- ================= HEADER ================= -->

    <div th:replace="~{fragments/header :: header}"></div>


    <!-- ================= PAGE HEADING ================= -->

    <div class="mt-4 mb-4">

        <h3 class="fw-bold">

            <i class="fa-solid fa-cart-shopping text-danger"></i>

            Manage Orders

        </h3>

    </div>


    <!-- ================= ORDERS CARD ================= -->

    <div class="card shadow border-0 rounded-4">

        <div class="card-body">


            <!-- TABLE -->

            <div class="table-responsive">

                <table class="table table-hover align-middle">


                    <!-- TABLE HEADER -->

                    <thead class="table-success">

                        <tr>

                            <th>
                                Order ID
                            </th>

                            <th>
                                User ID
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Address
                            </th>

                            <th>
                                Phone
                            </th>

                            <th>
                                Order Date
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <!-- TABLE BODY -->

                    <tbody>


                        <!-- ORDERS -->

                        <tr th:each="order : ${orders}">


                            <!-- ORDER ID -->

                            <td>

                                <strong
                                    th:text="${order.orderId}">

                                    1

                                </strong>

                            </td>


                            <!-- USER ID -->

                            <td th:text="${order.userId}">

                                1

                            </td>


                            <!-- TOTAL -->

                            <td>

                                <strong class="text-success">

                                    ₹<span
                                        th:text="${order.totalAmount}">

                                        500

                                    </span>

                                </strong>

                            </td>


                            <!-- ADDRESS -->

                            <td>

                                <span
                                    th:text="${order.address}">

                                    Address

                                </span>

                            </td>


                            <!-- PHONE -->

                            <td th:text="${order.phone}">

                                9876543210

                            </td>


                            <!-- ORDER DATE -->

                            <td>

                                <span
                                    th:text="${order.orderDate}">

                                    2026-08-08

                                </span>

                            </td>


                            <!-- STATUS -->

                            <td>


                                <form
                                    th:action="@{/order/admin/orders/status}"
                                    method="post"
                                    class="d-flex gap-2">


                                    <!-- ORDER ID -->

                                    <input
                                        type="hidden"
                                        name="orderId"
                                        th:value="${order.orderId}">


                                    <!-- STATUS -->

                                    <select
                                        name="status"
                                        class="form-select form-select-sm">


                                        <option
                                            value="Pending"
                                            th:selected="${order.status == 'Pending'}">

                                            Pending

                                        </option>


                                        <option
                                            value="Confirmed"
                                            th:selected="${order.status == 'Confirmed'}">

                                            Confirmed

                                        </option>


                                        <option
                                            value="Shipped"
                                            th:selected="${order.status == 'Shipped'}">

                                            Shipped

                                        </option>


                                        <option
                                            value="Delivered"
                                            th:selected="${order.status == 'Delivered'}">

                                            Delivered

                                        </option>


                                    </select>


                                    <!-- UPDATE BUTTON -->

                                    <button
                                        type="submit"
                                        class="btn btn-success btn-sm">

                                        Update

                                    </button>


                                </form>


                            </td>


                        </tr>


                        <!-- ================= NO ORDERS ================= -->

                        <tr
                            th:if="${#lists.isEmpty(orders)}">


                            <td
                                colspan="7"
                                class="text-center py-5">


                                <i
                                    class="fa-solid fa-cart-shopping fa-3x text-muted mb-3">
                                </i>


                                <h5 class="text-muted">

                                    No Orders Found

                                </h5>


                                <p class="text-muted mb-0">

                                    Customer orders will appear here.

                                </p>


                            </td>

                        </tr>


                    </tbody>


                </table>

            </div>


        </div>

    </div>


</div>


<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
