<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <div class="content">

        <!-- Header -->
        <div th:replace="~{fragments/header :: header}"></div>

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mt-4 mb-3">

            <h3 class="fw-bold">
                <i class="fa-solid fa-box text-success"></i>
                Product List
            </h3>

            <a th:href="@{/admin/product/add}"
               class="btn btn-success">
                <i class="fa-solid fa-plus"></i>
                Add Product
            </a>

        </div>

        <!-- Product Table -->
        <div class="card shadow border-0 rounded-4">

            <div class="card-header bg-success text-white">
                <h5 class="mb-0">All Products</h5>
            </div>

            <div class="card-body">

                <table class="table table-bordered table-hover text-center align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Image</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Brand</th>
                        <th>Qty</th>
                        <th>Cost</th>
                        <th>Selling</th>
                        <th>Rating</th>
                        <th>Weight</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="12" class="text-danger fw-bold">
                            No Product Found
                        </td>
                    </tr>

                    <tr th:each="product : ${products}">

                        <td th:text="${product.productId}"></td>

                        <td>
                            <img th:src="@{'/uploads/' + ${product.image}}"
                                 width="70"
                                 height="70"
                                 style="border-radius:8px;">
                        </td>

                        <td th:text="${product.productName}"></td>

                        <td th:text="${product.categoryName}"></td>

                        <td th:text="${product.brandName}"></td>

                        <td th:text="${product.quantity}"></td>

                        <td th:text="${product.costPrice}"></td>

                        <td th:text="${product.sellingPrice}"></td>

                        <td th:text="${product.rating}"></td>

                        <td>
                            <span th:text="${product.weight}"></span>
                            <span th:text="${product.weightType}"></span>
                        </td>

                        <td>

                            <span class="badge bg-success"
                                  th:if="${product.status=='Active'}"
                                  th:text="${product.status}">
                            </span>

                            <span class="badge bg-danger"
                                  th:if="${product.status=='Inactive'}"
                                  th:text="${product.status}">
                            </span>

                        </td>

                        <td>

                            <a th:href="@{/admin/product/edit/{id}(id=${product.productId})}"
                               class="btn btn-warning btn-sm">

                                <i class="fa-solid fa-pen"></i>
                                Edit

                            </a>

                            <a th:href="@{/admin/product/delete/{id}(id=${product.productId})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this Product?')">

                                <i class="fa-solid fa-trash"></i>
                                Delete

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
