<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Edit Product</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/admin/product/update}"
                  th:object="${product}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden" th:field="*{product_id}">

                <div class="mb-3">
                    <label>Product Name</label>
                    <input type="text" class="form-control" th:field="*{product_name}">
                </div>

                <div class="mb-3">
                    <label>Description</label>
                    <textarea class="form-control" th:field="*{product_desc}"></textarea>
                </div>

                <div class="mb-3">
                    <label>Category</label>

                    <select class="form-select" th:field="*{fk_cat_id}">

                        <option value="">Select Category</option>

                       
						<option
						    th:each="cat : ${categoryList}"
						    th:value="${cat.catId}"
						    th:text="${cat.catName}">
						</option>

                    </select>
                </div>

                <div class="mb-3">
                    <label>Brand</label>

                    <select class="form-select" th:field="*{fk_brand_id}">

                        <option value="">Select Brand</option>

                        <option
                                th:each="brand : ${brandList}"
                                th:value="${brand.brandId}"
                                th:text="${brand.brandName}">
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label>Quantity</label>
                    <input type="number" class="form-control" th:field="*{product_qty}">
                </div>

                <div class="mb-3">
                    <label>Cost Price</label>
                    <input type="number" step="0.01"
                           class="form-control"
                           th:field="*{product_cost_price}">
                </div>

                <div class="mb-3">
                    <label>Selling Price</label>
                    <input type="number"
                           step="0.01"
                           class="form-control"
                           th:field="*{product_selling_price}">
                </div>

                <div class="mb-3">
                    <label>Rating</label>
                    <input type="number"
                           class="form-control"
                           th:field="*{product_rating}">
                </div>

                <div class="mb-3">
                    <label>Weight</label>
                    <input type="number"
                           step="0.01"
                           class="form-control"
                           th:field="*{product_weight}">
                </div>

                <div class="mb-3">
                    <label>Weight Type</label>

                    <select class="form-select"
                            th:field="*{product_weight_type}">

                        <option value="g">Gram</option>
                        <option value="kg">Kilogram</option>
                        <option value="ml">Millilitre</option>
                        <option value="l">Litre</option>

                    </select>
                </div>

                <div class="mb-3">

                    <label>Current Image</label>
                    <br>

                   

                </div>

                <div class="mb-3">

                    <label>New Small Image</label>

                    <input type="file"
                           class="form-control"
                           name="file1">

                </div>

                <div class="mb-3">

                    <label>New Large Image</label>

                    <input type="file"
                           class="form-control"
                           name="file2">

                </div>

                <div class="mb-3">

                    <label>Status</label>

                    <select class="form-select"
                            th:field="*{product_status}">

                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>

                    </select>

                </div>

                <button class="btn btn-success w-100">
                    Update Product
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
