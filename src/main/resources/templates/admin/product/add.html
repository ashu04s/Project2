<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container-fluid mt-4">

        <div class="card shadow">

            <div class="card-header bg-success text-white">
                <h4 class="mb-0">
                    <i class="fa-solid fa-box-open"></i>
                    Add Product
                </h4>
            </div>

            <div class="card-body">

                <form th:action="@{/admin/product/save}"
                      th:object="${product}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{product_name}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>

                            <select class="form-select"
                                    th:field="*{fk_cat_id}">

                                <option value="">Select Category</option>

                                <option th:each="cat : ${categoryList}"
                                        th:value="${cat.catId}"
                                        th:text="${cat.catName}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Brand</label>

                            <select class="form-select"
                                    th:field="*{fk_brand_id}">

                                <option value="">Select Brand</option>

                                <option th:each="brand : ${brandList}"
                                        th:value="${brand.brandId}"
                                        th:text="${brand.brandName}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quantity</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{product_qty}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Cost Price</label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{product_cost_price}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Selling Price</label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{product_selling_price}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Rating</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{product_rating}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Weight</label>

                            <input type="number"
                                   step="0.01"
                                   class="form-control"
                                   th:field="*{product_weight}">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Weight Type</label>

                            <select class="form-select"
                                    th:field="*{product_weight_type}">

                                <option value="g">Gram</option>
                                <option value="kg">Kilogram</option>
                                <option value="l">Litre</option>
                                <option value="ml">Millilitre</option>

                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>

                            <select class="form-select"
                                    th:field="*{product_status}">

                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>

                            </select>
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">Description</label>

                            <textarea class="form-control"
                                      rows="4"
                                      th:field="*{product_desc}">
                            </textarea>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Small Image</label>

                            <input type="file"
                                   class="form-control"
                                   name="file1">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Large Image</label>

                            <input type="file"
                                   class="form-control"
                                   name="file2">
                        </div>

                    </div>

                    <div class="mt-4">

                        <button class="btn btn-success">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Save Product

                        </button>

                        <a th:href="@{/admin/product/list}"
                           class="btn btn-secondary">

                            Back

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
