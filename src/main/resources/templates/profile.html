<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <style>

        body {
            background: #f5f8f5;
            font-family: Arial, sans-serif;
        }

        .profile-section {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-card {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
            padding: 40px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            background: #198754;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .profile-title {
            color: #198754;
            font-weight: bold;
            text-align: center;
        }

        .welcome-text {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f5f8f5;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
        }

        .info-label {
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }

        .info-value {
            font-weight: bold;
            color: #222;
        }

        .profile-buttons {
            margin-top: 30px;
        }

        .home-btn {
            border: 1px solid #198754;
            color: #198754;
        }

        .home-btn:hover {
            background: #198754;
            color: white;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
        }

        .logout-btn:hover {
            background: #bb2d3b;
            color: white;
        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div th:replace="~{fragments/dheader :: header}"></div>


<!-- ================= PROFILE ================= -->

<section class="profile-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="profile-card">


                    <!-- Profile Icon -->

                    <div class="profile-icon">

                        <i class="fa-solid fa-user"></i>

                    </div>


                    <!-- Title -->

                    <h2 class="profile-title">
                        My Profile
                    </h2>


                    <p class="welcome-text">

                        Welcome,
                        <strong th:text="${user.name}">
                            User
                        </strong>

                    </p>


                    <!-- Name -->

                    <div class="info-box">

                        <div class="info-label">
                            <i class="fa-solid fa-user me-2"></i>
                            Name
                        </div>

                        <div class="info-value"
                             th:text="${user.name}">

                            User

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="info-box">

                        <div class="info-label">
                            <i class="fa-solid fa-envelope me-2"></i>
                            Email
                        </div>

                        <div class="info-value"
                             th:text="${user.email}">

                            user@gmail.com

                        </div>

                    </div>


                    <!-- Buttons -->

                    <div class="profile-buttons">

                        <div class="row g-3">

                            <div class="col-md-6">

                                <a th:href="@{/home}"
                                   class="btn home-btn w-100">

                                    <i class="fa-solid fa-house me-2"></i>

                                    Home

                                </a>

                            </div>


                            <div class="col-md-6">

                                <a th:href="@{/logout}"
                                   class="btn logout-btn w-100">

                                    <i class="fa-solid fa-right-from-bracket me-2"></i>

                                    Logout

                                </a>

                            </div>

                        </div>

                    </div>


                </div>

            </div>

        </div>

    </div>

</section>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
